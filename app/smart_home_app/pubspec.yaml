name: smart_home_app
description: "Bluetooth smart home controller for an 8051-based home automation system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_bluetooth_serial:
    git:
      url: https://github.com/edufolly/flutter_bluetooth_serial
      ref: master
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.3
  speech_to_text: ^7.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true